name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Apply migrations to a throwaway D1
        run: npx wrangler d1 migrations apply ugtp --local --persist-to .wrangler/ci-state
        env:
          CI: "1"

      - name: End-to-end suite (workerd + D1)
        run: node tests/e2e.mjs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            .wrangler/ci-state
            *.log
          if-no-files-found: ignore
          retention-days: 7
